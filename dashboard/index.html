<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRREH Motivated Seller Leads — Multi-County</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; font-size:14px; background:#f5f5f5; color:#1a1a1a; }

/* TOP BAR */
.topbar { background:#1e3a8a; color:#fff; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.topbar-title { font-size:18px; font-weight:700; }
.topbar-sub { font-size:11px; opacity:.7; margin-top:1px; }
.topbar-right { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.updated { font-size:11px; opacity:.85; }
.btn-export { background:#fff; color:#1e3a8a; border:none; padding:8px 14px; border-radius:5px; cursor:pointer; font-size:12px; font-weight:600; }
.btn-export:hover { background:#e0e7ff; }
.btn-export.alt { background:#1d4ed8; color:#fff; }
.btn-export.alt:hover { background:#2563eb; }

/* COUNTY TABS */
.county-tabs { display:flex; gap:0; background:#162e6b; border-bottom:1px solid #0f2350; overflow-x:auto; }
.county-tab { padding:10px 18px; color:#cbd5e1; cursor:pointer; font-size:13px; font-weight:600; border:none; background:none; border-bottom:3px solid transparent; white-space:nowrap; }
.county-tab:hover { color:#fff; background:#1e3a8a; }
.county-tab.active { color:#fff; border-bottom-color:#60a5fa; background:#1e3a8a; }
.county-tab .pill { background:#0f2350; color:#93c5fd; border-radius:10px; padding:1px 7px; font-size:10px; margin-left:6px; }
.county-tab .err { color:#fca5a5; font-size:10px; margin-left:6px; }

/* STATS */
.stats { display:flex; background:#fff; border-bottom:1px solid #ddd; overflow-x:auto; }
.stat { flex:1; min-width:100px; padding:14px 16px; border-right:1px solid #eee; text-align:center; }
.stat-label { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:#888; margin-bottom:4px; }
.stat-value { font-size:26px; font-weight:700; line-height:1; }
.blue{color:#1e3a8a;} .green{color:#059669;} .amber{color:#d97706;} .red{color:#dc2626;} .black{color:#111;} .teal{color:#0d9488;} .purple{color:#7c3aed;}

/* LAYOUT */
.body-layout { display:flex; min-height:calc(100vh - 190px); }
.sidebar { width:200px; min-width:200px; background:#fff; border-right:1px solid #ddd; padding:16px 12px; overflow-y:auto; }
.sidebar-section { margin-bottom:20px; }
.sidebar-heading { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#999; margin-bottom:6px; padding-bottom:5px; border-bottom:1px solid #eee; }
.filter-btn { display:flex; align-items:center; justify-content:space-between; width:100%; padding:6px 8px; margin-bottom:2px; background:none; border:1px solid transparent; border-radius:4px; cursor:pointer; font-size:12px; color:#555; text-align:left; }
.filter-btn:hover { background:#f0f4ff; color:#1e3a8a; }
.filter-btn.active { background:#eff6ff; border-color:#bfdbfe; color:#1e3a8a; font-weight:600; }
.filter-btn span.cnt { background:#f0f0f0; border-radius:10px; padding:1px 6px; font-size:10px; color:#888; flex-shrink:0; margin-left:4px; }
.filter-btn.active span.cnt { background:#dbeafe; color:#1e3a8a; }
.filter-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.main-content { flex:1; overflow:hidden; }
.search-bar { display:flex; align-items:center; gap:10px; padding:10px 16px; background:#fff; border-bottom:1px solid #ddd; }
.search-bar input { flex:1; padding:7px 12px; border:1px solid #ccc; border-radius:4px; font-size:13px; outline:none; }
.search-bar input:focus { border-color:#1e3a8a; }
.search-bar select { padding:7px 10px; border:1px solid #ccc; border-radius:4px; font-size:12px; outline:none; background:#fff; }
.rec-count { font-size:11px; color:#888; white-space:nowrap; }

.table-wrapper { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; min-width:880px; }
table thead tr { background:#f0f0f0; border-bottom:2px solid #ccc; }
table thead th { padding:9px 12px; text-align:left; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:#666; white-space:nowrap; }
table tbody tr { border-bottom:1px solid #eee; background:#fff; cursor:pointer; }
table tbody tr:hover { background:#f0f4ff; }
table tbody tr:nth-child(even) { background:#fafafa; }
table tbody tr:nth-child(even):hover { background:#f0f4ff; }
table td { padding:9px 12px; vertical-align:middle; }

.score { display:inline-flex; align-items:center; justify-content:center; width:38px; height:24px; border-radius:12px; font-size:12px; font-weight:700; border:1px solid; }
.score-hi{background:#d1fae5;color:#065f46;border-color:#6ee7b7;} .score-md{background:#fef3c7;color:#92400e;border-color:#fcd34d;} .score-lo{background:#f3f4f6;color:#6b7280;border-color:#d1d5db;}

.type-badge { display:inline-block; padding:2px 7px; border-radius:3px; font-size:10px; font-weight:700; border:1px solid; white-space:nowrap; }
.t-LP{background:#fee2e2;color:#991b1b;border-color:#fca5a5;} .t-NOFC{background:#ffedd5;color:#9a3412;border-color:#fdba74;}
.t-TAXDEED{background:#fef9c3;color:#854d0e;border-color:#fde047;} .t-JUD{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd;}
.t-LN{background:#e0f2fe;color:#0c4a6e;border-color:#7dd3fc;} .t-INH{background:#ccfbf1;color:#115e59;border-color:#5eead4;}
.t-PRO{background:#dbeafe;color:#1e3a8a;border-color:#93c5fd;} .t-TAX{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd;} .t-MISC{background:#f3f4f6;color:#555;border-color:#ddd;}
.t-INTRA{background:#fce7f3;color:#9d174f;border-color:#f9a8d4;}

.county-chip { display:inline-block; padding:2px 7px; border-radius:3px; font-size:10px; font-weight:700; background:#eef2ff; color:#3730a3; border:1px solid #c7d2fe; white-space:nowrap; }

.flags { display:flex; gap:4px; flex-wrap:wrap; }
.flag { font-size:10px; padding:1px 6px; border-radius:3px; background:#f1f5f9; color:#475569; border:1px solid #e2e8f0; white-space:nowrap; }
.flag.hot { background:#fef2f2; color:#b91c1c; border-color:#fecaca; }
.amt { font-weight:600; } .amt.big { color:#b45309; }
.view-link { color:#1e3a8a; font-size:12px; text-decoration:none; font-weight:600; }
.view-link:hover { text-decoration:underline; }

.empty { padding:48px 20px; text-align:center; }
.empty-title { font-size:15px; font-weight:600; color:#666; }

/* MODAL */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; align-items:center; justify-content:center; padding:20px; }
.modal-bg.open { display:flex; }
.modal { background:#fff; border-radius:8px; max-width:680px; width:100%; max-height:88vh; overflow-y:auto; }
.modal-head { display:flex; justify-content:space-between; align-items:flex-start; padding:18px 20px; border-bottom:1px solid #eee; position:sticky; top:0; background:#fff; }
.modal-title { font-size:18px; font-weight:700; }
.modal-close { background:#f3f4f6; border:none; padding:6px 12px; border-radius:5px; cursor:pointer; font-size:12px; }
.modal-body { padding:20px; display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; }
.modal-field { display:flex; flex-direction:column; }
.modal-field.full { grid-column:1 / -1; }
.modal-field label { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:#999; margin-bottom:3px; }
.modal-field .val { font-size:14px; }
.modal-field .mono { font-family:monospace; }
.score-bar { display:flex; align-items:center; gap:10px; }
.score-bar-bg { flex:1; height:8px; background:#eee; border-radius:4px; overflow:hidden; }
.score-bar-fill { height:100%; }
.modal-foot { padding:14px 20px; border-top:1px solid #eee; display:flex; gap:8px; flex-wrap:wrap; }
.btn-sec { background:#f3f4f6; border:1px solid #e5e7eb; padding:8px 14px; border-radius:5px; cursor:pointer; font-size:13px; }
.btn-sec:hover { background:#e5e7eb; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">BRREH Motivated Seller Leads</div>
    <div class="topbar-sub" id="topSub">Multi-county distressed-property dashboard</div>
  </div>
  <div class="topbar-right">
    <span class="updated" id="updated">Loading…</span>
    <button class="btn-export" onclick="exportCSV()">⬇︎ Export CSV (this view)</button>
    <button class="btn-export alt" onclick="exportXLSX()">⬇︎ Export XLSX (all counties, tabbed)</button>
  </div>
</div>

<!-- COUNTY TABS -->
<div class="county-tabs" id="countyTabs"></div>

<!-- STATS -->
<div class="stats">
  <div class="stat"><div class="stat-label">Total Leads</div><div class="stat-value blue" id="sTotal">—</div></div>
  <div class="stat"><div class="stat-label">With Address</div><div class="stat-value green" id="sAddr">—</div></div>
  <div class="stat"><div class="stat-label">High Score 70+</div><div class="stat-value red" id="sHigh">—</div></div>
  <div class="stat"><div class="stat-label">Pre-Foreclosure</div><div class="stat-value amber" id="sFC">—</div></div>
  <div class="stat"><div class="stat-label">Lis Pendens</div><div class="stat-value red" id="sLP">—</div></div>
  <div class="stat"><div class="stat-label">Probate / Inh.</div><div class="stat-value teal" id="sProb">—</div></div>
  <div class="stat"><div class="stat-label">Delinquent Tax</div><div class="stat-value purple" id="sTax">—</div></div>
  <div class="stat"><div class="stat-label">Avg Score</div><div class="stat-value black" id="sAvg">—</div></div>
</div>

<div class="body-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-heading">Lead Type</div>
      <div id="typeFilters"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-heading">Score</div>
      <button class="filter-btn active" data-score="all" onclick="setScore(this,'all')"><span class="filter-label">All Scores</span></button>
      <button class="filter-btn" data-score="high" onclick="setScore(this,'high')"><span class="filter-label">🔥 High 70–100</span></button>
      <button class="filter-btn" data-score="mid" onclick="setScore(this,'mid')"><span class="filter-label">⚡ Mid 50–69</span></button>
      <button class="filter-btn" data-score="low" onclick="setScore(this,'low')"><span class="filter-label">◌ Low &lt;50</span></button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-heading">Flags</div>
      <div id="flagFilters"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-content">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search owner, document number, legal description…" oninput="applyFilters()">
      <select id="sortSel" onchange="applyFilters()">
        <option value="score_desc">🔥 Hottest First · Top Score</option>
        <option value="date_score">Newest First · Best Score on Top</option>
        <option value="score_asc">Score — Low to High</option>
        <option value="date_desc">Date — Newest First</option>
        <option value="date_asc">Date — Oldest First</option>
        <option value="amount_desc">Amount — Largest First</option>
        <option value="owner_asc">Owner — A to Z</option>
      </select>
      <span class="rec-count" id="recCount"></span>
    </div>
    <div class="table-wrapper">
      <div id="tableArea"><div class="empty"><div class="empty-title">Loading leads…</div></div></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <div><div class="modal-title" id="mTitle">—</div><div id="mBadge" style="margin-top:6px"></div></div>
      <button class="modal-close" onclick="closeModal()">✕ Close</button>
    </div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-foot" id="mFoot"></div>
  </div>
</div>

<script>
/* ============================================================
   COUNTY SOURCES — add a county by adding one line here.
   Each repo publishes dashboard/records.json to its own Pages
   site; data stays separate, the dashboard aggregates at view.
   (All on brreh.github.io => same-origin => no CORS issues.)
   ============================================================ */
const COUNTY_SOURCES = {
  HORRY:      'https://brreh.github.io/horry-county-leads/records.json',
  DARLINGTON: 'https://brreh.github.io/darlington-county-leads/records.json',
  // FLORENCE: 'https://brreh.github.io/florence-county-leads/records.json',
};

const CAT_LABELS = { LP:'Lis Pendens', NOFC:'Notice of Foreclosure', TAXDEED:'Tax Deed',
  JUD:'Judgment', LN:'Lien', INH:'Inherited', PRO:'Probate', NOC:'Notice of Comm.',
  RELLP:'Release LP', TAX:'Delinquent Tax', INTRA:'Intrafamily / Heir Property' };
const TYPE_ORDER = ['NOFC','LP','TAXDEED','JUD','LN','INH','INTRA','PRO','TAX','NOC','RELLP'];
const HOT_FLAGS = ['Lis pendens','Pre-foreclosure','Judgment lien','Tax lien','Tax delinquent',
  'Out-of-state owner','Absentee owner','Tax debt >$50k','Tax debt >$25k','Tax debt >$10k',
  'Intrafamily transfer','Heir property'];
const FLAG_LIST = ['Lis pendens','Pre-foreclosure','Judgment lien','Tax lien','Mechanic lien',
  'HOA lien','Probate / estate','Inherited / estate','Tax delinquent','Out-of-state owner',
  'Absentee owner','Tax debt >$50k','Tax debt >$25k','Tax debt >$10k','New this week',
  'Intrafamily transfer','Heir property','Nominal consideration'];

let BY_COUNTY = {};            // { HORRY:[...], DARLINGTON:[...] }
let META = {};                 // { HORRY:{fetched_at,...}, ... }
let ALL = [];                  // active working set (county filtered)
let filtered = [];
let activeCounty = 'ALL';
let activeType = 'all', activeScore = 'all', activeFlag = 'all';

async function loadAll() {
  const names = Object.keys(COUNTY_SOURCES);
  await Promise.all(names.map(async (name) => {
    try {
      const r = await fetch(COUNTY_SOURCES[name] + '?v=' + Date.now());
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      META[name] = { fetched_at: d.fetched_at, total: (d.records||[]).length, error:null };
      BY_COUNTY[name] = (d.records || []).map(rec => ({ ...rec, county: rec.county || name }));
    } catch (e) {
      META[name] = { fetched_at:null, total:0, error: e.message };
      BY_COUNTY[name] = [];
    }
  }));
  buildCountyTabs();
  buildFlagFilters();
  selectCounty('ALL');
}

function buildCountyTabs() {
  const tabs = ['ALL', ...Object.keys(COUNTY_SOURCES)];
  document.getElementById('countyTabs').innerHTML = tabs.map(name => {
    const cnt = name === 'ALL'
      ? Object.values(BY_COUNTY).reduce((s,a)=>s+a.length,0)
      : (BY_COUNTY[name]||[]).length;
    const err = (name !== 'ALL' && META[name] && META[name].error)
      ? `<span class="err" title="${esc(META[name].error)}">⚠︎</span>` : '';
    const label = name === 'ALL' ? 'All Counties' : titleCase(name);
    return `<button class="county-tab ${name===activeCounty?'active':''}" data-county="${name}"
      onclick="selectCounty('${name}')">${label}<span class="pill">${cnt}</span>${err}</button>`;
  }).join('');
}

function selectCounty(name) {
  activeCounty = name;
  document.querySelectorAll('.county-tab').forEach(b =>
    b.classList.toggle('active', b.dataset.county === name));
  ALL = name === 'ALL'
    ? Object.values(BY_COUNTY).flat()
    : (BY_COUNTY[name] || []).slice();
  ALL = ALL.map((r,i) => ({ ...r, _id:i }));

  // freshness line
  const stamps = Object.keys(META)
    .filter(n => (name==='ALL' || n===name) && META[n] && META[n].fetched_at)
    .map(n => `${titleCase(n)} ${fmt(META[n].fetched_at)}`);
  document.getElementById('updated').textContent = stamps.length ? ('Updated · ' + stamps.join('  •  ')) : 'No data loaded';
  document.getElementById('topSub').textContent =
    name === 'ALL' ? 'Multi-county distressed-property dashboard'
                   : `${titleCase(name)} County, SC — distressed-property leads`;

  updateStats(); buildTypeFilters(); applyFilters();
}

function updateStats() {
  const n = (f)=>ALL.filter(f).length;
  document.getElementById('sTotal').textContent = ALL.length;
  document.getElementById('sAddr').textContent  = n(r=>r.prop_address);
  document.getElementById('sHigh').textContent  = n(r=>r.score>=70);
  document.getElementById('sFC').textContent    = n(r=>r.cat==='NOFC');
  document.getElementById('sLP').textContent    = n(r=>r.cat==='LP');
  document.getElementById('sProb').textContent  = n(r=>r.cat==='PRO'||r.cat==='INH');
  document.getElementById('sTax').textContent   = n(r=>r.cat==='TAX');
  document.getElementById('sAvg').textContent   = ALL.length ? Math.round(ALL.reduce((s,r)=>s+(r.score||0),0)/ALL.length) : 0;
}

function buildTypeFilters() {
  const counts = {}; ALL.forEach(r => counts[r.cat]=(counts[r.cat]||0)+1);
  let html = `<button class="filter-btn ${activeType==='all'?'active':''}" data-cat="all" onclick="setType(this,'all')">
    <span class="filter-label">All Types</span><span class="cnt">${ALL.length}</span></button>`;
  TYPE_ORDER.filter(c=>counts[c]).forEach(c => {
    html += `<button class="filter-btn ${activeType===c?'active':''}" data-cat="${c}" onclick="setType(this,'${c}')">
      <span class="filter-label">${CAT_LABELS[c]||c}</span><span class="cnt">${counts[c]}</span></button>`;
  });
  document.getElementById('typeFilters').innerHTML = html;
}

function buildFlagFilters() {
  let html = `<button class="filter-btn active" data-flag="all" onclick="setFlag(this,'all')"><span class="filter-label">All Flags</span></button>`;
  FLAG_LIST.forEach(f => {
    html += `<button class="filter-btn" data-flag="${esc(f)}" onclick="setFlag(this,'${esc(f)}')"><span class="filter-label">${esc(f)}</span></button>`;
  });
  document.getElementById('flagFilters').innerHTML = html;
}

function setType(btn,val){ document.querySelectorAll('[data-cat]').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); activeType=val; applyFilters(); }
function setScore(btn,val){ document.querySelectorAll('[data-score]').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); activeScore=val; applyFilters(); }
function setFlag(btn,val){ document.querySelectorAll('[data-flag]').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); activeFlag=val; applyFilters(); }

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const sort = document.getElementById('sortSel').value;
  filtered = ALL.filter(r => {
    if (activeType!=='all' && r.cat!==activeType) return false;
    if (activeScore==='high' && r.score<70) return false;
    if (activeScore==='mid'  && (r.score<50||r.score>=70)) return false;
    if (activeScore==='low'  && r.score>=50) return false;
    if (activeFlag!=='all'   && !(r.flags||[]).includes(activeFlag)) return false;
    if (q) {
      const hay=[r.owner,r.grantee,r.doc_num,r.legal,r.cat_label,r.county].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  filtered.sort((a,b)=>{ switch(sort){
    case 'date_score': return (b.filed||'').localeCompare(a.filed||'')||(b.score||0)-(a.score||0);
    case 'score_desc': return (b.score||0)-(a.score||0);
    case 'score_asc':  return (a.score||0)-(b.score||0);
    case 'date_desc':  return (b.filed||'').localeCompare(a.filed||'');
    case 'date_asc':   return (a.filed||'').localeCompare(b.filed||'');
    case 'amount_desc':return (b.amount||0)-(a.amount||0);
    case 'owner_asc':  return (a.owner||'').localeCompare(b.owner||''); } return 0; });
  document.getElementById('recCount').textContent = `${filtered.length} of ${ALL.length} records`;
  renderTable();
}

function renderTable() {
  const el = document.getElementById('tableArea');
  if (!filtered.length) { el.innerHTML = `<div class="empty"><div class="empty-title">No leads match your filters</div>
    <div style="color:#999;margin-top:6px">Try a different county tab or adjust the filters</div></div>`; return; }
  const showCounty = activeCounty === 'ALL';
  const rows = filtered.map(r => {
    const sc = r.score>=70?'score-hi':r.score>=50?'score-md':'score-lo';
    const tc = 't-'+(r.cat||'MISC');
    const amt = r.amount ? '$'+Number(r.amount).toLocaleString('en-US',{minimumFractionDigits:0}) : '—';
    const amtCls = r.amount>100000?'amt big':'amt';
    const flags = (r.flags||[]).slice(0,3).map(f=>`<span class="flag${HOT_FLAGS.includes(f)?' hot':''}">${esc(f)}</span>`).join('');
    const viewUrl = r.clerk_url || '';
    return `<tr onclick="openModal(${r._id})">
      <td><span class="score ${sc}">${r.score||0}</span></td>
      ${showCounty?`<td><span class="county-chip">${esc(titleCase(r.county||''))}</span></td>`:''}
      <td><span class="type-badge ${tc}">${esc(r.cat_label||r.cat||'?')}</span></td>
      <td style="font-family:monospace;font-size:11px;color:#666;white-space:nowrap">${esc(r.filed||'—')}</td>
      <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500" title="${esc(r.owner||'')}">${esc(r.owner||'—')}</td>
      <td><span class="${amtCls}">${amt}</span></td>
      <td><div class="flags">${flags}</div></td>
      <td>${viewUrl?`<a class="view-link" href="${esc(viewUrl)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'—'}</td>
    </tr>`;
  }).join('');
  el.innerHTML = `<div class="table-wrapper"><table><thead><tr>
      <th style="width:52px">Score</th>
      ${showCounty?'<th style="width:96px">County</th>':''}
      <th style="width:140px">Lead Type</th>
      <th style="width:100px">Filed Date</th>
      <th>Owner / Distressed Party</th>
      <th style="width:96px">Amount</th>
      <th>Flags</th>
      <th style="width:66px">Record</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function openModal(id) {
  const r = ALL.find(a=>a._id===id); if(!r) return;
  const scoreColor = r.score>=70?'#059669':r.score>=50?'#d97706':'#9ca3af';
  const tc='t-'+(r.cat||'MISC');
  const amt = r.amount ? '$'+Number(r.amount).toLocaleString('en-US') : '—';
  const flags = (r.flags||[]).map(f=>`<span class="flag${HOT_FLAGS.includes(f)?' hot':''}">${esc(f)}</span>`).join('');
  document.getElementById('mTitle').textContent = r.owner||'Unknown';
  document.getElementById('mBadge').innerHTML =
    `<span class="type-badge ${tc}">${esc(r.cat_label||r.cat||'')}</span> <span class="county-chip">${esc(titleCase(r.county||''))}</span>`;
  const bookpage = (r.doc_num||'').includes('/') ? r.doc_num.split('/') : ['',''];
  document.getElementById('mBody').innerHTML = `
    <div class="modal-field full"><label>Seller Score</label><div class="score-bar">
      <span style="font-size:18px;font-weight:700;color:${scoreColor};min-width:30px">${r.score||0}</span>
      <div class="score-bar-bg"><div class="score-bar-fill" style="width:${Math.min(100,r.score||0)}%;background:${scoreColor}"></div></div></div></div>
    <div class="modal-field"><label>Document / Case Number</label><div class="val mono">${esc(r.doc_num||'—')}</div></div>
    <div class="modal-field"><label>Filed Date</label><div class="val mono">${esc(r.filed||'—')}</div></div>
    <div class="modal-field"><label>Owner / Distressed Party</label><div class="val" style="font-weight:600">${esc(r.owner||'—')}</div></div>
    <div class="modal-field"><label>TMS / Parcel</label><div class="val mono">${esc(r.tms||'—')}</div></div>
    <div class="modal-field"><label>Property Address</label><div class="val">${esc([r.prop_address,r.prop_city,r.prop_state,r.prop_zip].filter(Boolean).join(', ')||'—')}</div></div>
    <div class="modal-field"><label>Mailing Address</label><div class="val">${esc([r.mail_address,r.mail_city,r.mail_state,r.mail_zip].filter(Boolean).join(', ')||'—')}</div></div>
    <div class="modal-field"><label>Amount / Debt Owed</label><div class="val" style="font-size:18px;font-weight:700;color:#d97706">${amt}</div></div>
    <div class="modal-field"><label>Source</label><div class="val" style="font-size:12px">${esc(r.source||'—')}</div></div>
    <div class="modal-field full"><label>Legal Description / Comments</label><div class="val mono" style="font-size:11px;color:#555">${esc(r.legal||'—')}</div></div>
    <div class="modal-field full"><label>Motivated Seller Flags</label><div class="flags" style="margin-top:4px">${flags||'<span style="color:#999;font-size:12px">None</span>'}</div></div>`;
  document.getElementById('mFoot').innerHTML = `
    ${r.clerk_url?`<a href="${esc(r.clerk_url)}" target="_blank"><button class="btn-sec">🔍 Open Public Record</button></a>`:''}
    <button class="btn-sec" onclick="copyRow(${r._id})">📋 Copy Row</button>
    <button class="btn-sec" onclick="closeModal()">Close</button>`;
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ---------- exports ---------- */
const CSV_COLS = ['First Name','Last Name','Mailing Address','Mailing City','Mailing State','Mailing Zip',
  'Property Address','Property City','Property State','Property Zip','Phone 1','Phone 2','Email 1','Email 2',
  'Lead Type','Document Type','Date Filed','Document Number','Amount/Debt Owed','TMS Parcel','Delinquent Tax',
  'Seller Score','Motivated Seller Flags','Source','Public Records URL','County'];

function rowArray(r){
  return [ r.first_name||'', r.last_name||'', r.mail_address||'', r.mail_city||'', r.mail_state||'SC', r.mail_zip||'',
    r.prop_address||'', r.prop_city||'', r.prop_state||'SC', r.prop_zip||'', r.phone1||'', r.phone2||'', r.email1||'', r.email2||'',
    r.cat_label||'', r.cat||'', r.filed||'', r.doc_num||'', (r.amount??''), r.tms||'', r.delinquent_tax||'',
    r.score||0, (r.flags||[]).join('; '), r.source||'', r.clerk_url||'', titleCase(r.county||'') ];
}
function exportCSV() {
  const rows = [CSV_COLS.join(',')];
  filtered.forEach(r => rows.push(rowArray(r).map(csvCell).join(',')));
  const tag = activeCounty==='ALL' ? 'all' : activeCounty.toLowerCase();
  download(new Blob([rows.join('\n')],{type:'text/csv'}), `brreh_${tag}_leads_${today()}.csv`);
}
function exportXLSX() {
  if (typeof XLSX === 'undefined') { alert('XLSX library still loading — try again in a moment.'); return; }
  const wb = XLSX.utils.book_new();
  Object.keys(BY_COUNTY).forEach(name => {
    const data = [CSV_COLS, ...(BY_COUNTY[name]||[]).map(rowArray)];
    const ws = XLSX.utils.aoa_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, titleCase(name).slice(0,31));
  });
  XLSX.writeFile(wb, `brreh_leads_by_county_${today()}.xlsx`);
}
function copyRow(id){ const r=ALL.find(a=>a._id===id); if(!r) return;
  navigator.clipboard.writeText(rowArray(r).join('\t')).then(()=>alert('Copied!')); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function csvCell(s){ s=String(s==null?'':s); return (s.includes(',')||s.includes('"')||s.includes('\n'))?'"'+s.replace(/"/g,'""')+'"':s; }
function titleCase(s){ return String(s||'').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()); }
function fmt(iso){ try{ const d=new Date(iso); return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return '';} }
function today(){ return new Date().toISOString().slice(0,10); }
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); }

loadAll();
</script>
